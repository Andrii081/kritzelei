<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kritzelei">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f8fa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}img{max-width:100%}</style>
<title>Kritzelei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Rubik:wght@400;500;600&display=swap">
<script src="jspdf.umd.min.js"></script>
<style>
/* Layout: a cool blue-grey desk; notebooks lie on it as paper with coloured spines; the open notebook is a full-screen workspace: two toolbar rows over a zoomable scroller of A4 sheets. */
:root{
  --desk:#e4e8ee; --surface:#f7f8fa; --raise:#ffffff; --ink:#1a2130; --muted:#5b6578;
  --line:#cfd6e0; --accent:#2747c4; --accent-ink:#ffffff; --danger:#c2362b; --paper-shadow:rgba(30,40,60,.16);
  --f-display:"Caveat","Segoe Print","Bradley Hand",cursive;
  --f-ui:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#13161b; --surface:#1c2027; --raise:#242932; --ink:#e7eaf0; --muted:#9aa3b3;
  --line:#2e3440; --accent:#8098ff; --accent-ink:#0f1430; --danger:#ff7a6e; --paper-shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#13161b; --surface:#1c2027; --raise:#242932; --ink:#e7eaf0; --muted:#9aa3b3;
  --line:#2e3440; --accent:#8098ff; --accent-ink:#0f1430; --danger:#ff7a6e; --paper-shadow:rgba(0,0,0,.5); color-scheme:dark}
html,body{background:var(--desk);color:var(--ink)}
[hidden]{display:none!important}
body{font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:8px 12px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.sm{padding:5px 9px;font-size:13.5px}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.45;cursor:default}

/* Library */
#lib{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
.libhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;justify-content:space-between}
.brand{font-family:var(--f-display);font-size:56px;line-height:.9;font-weight:700;letter-spacing:.5px}
.brand small{display:block;font-family:var(--f-ui);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:6px}
.libactions{display:flex;flex-wrap:wrap;gap:8px}
.libtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.libtools input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--raise)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:5px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.newform{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.newform input[type=text]{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 10px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 20px}
.card{display:flex;flex-direction:column;gap:8px;min-width:0}
.cover{position:relative;display:block;width:100%;aspect-ratio:1000/1414;border:0;padding:0;background:#fff;border-radius:2px 6px 6px 2px;box-shadow:0 1px 2px var(--paper-shadow),0 8px 20px -10px var(--paper-shadow);overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.cover .spine{position:absolute;inset:0 auto 0 0;width:9px;background:var(--spine)}
.cardmeta{display:flex;gap:6px;align-items:flex-start}
.cardmeta div{flex:1;min-width:0}
.cardmeta h3{margin:0;font-size:15px;font-weight:600;overflow-wrap:anywhere;text-wrap:balance}
.cardmeta p{margin:0;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.more{border:0;background:transparent;border-radius:6px;padding:2px 6px;font-size:18px;line-height:1;color:var(--muted)}
.cardact{display:flex;flex-direction:column;gap:6px}
.cardact label{font-size:12px;color:var(--muted)}
.cardact input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);min-width:0}
.cardact .row{display:flex;gap:6px;flex-wrap:wrap}
.cardact .btn{padding:6px 10px;font-size:13.5px}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:28px;border:1.5px dashed var(--line);border-radius:12px}
.empty h2{margin:0;font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.empty canvas{width:220px;height:90px;max-width:100%}
.note{font-size:13px;color:var(--muted);max-width:70ch;margin:0}

/* Notebook workspace */
#nb{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--desk);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:2}
.bar{flex:none;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5}
.barin{display:flex;align-items:center;gap:4px;padding:6px 10px;overflow-x:auto;scrollbar-width:none}
.barin::-webkit-scrollbar{display:none}
.barin > *{flex:0 0 auto}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px;display:inline-block;vertical-align:middle}
.ib{width:40px;height:40px;display:inline-grid;place-items:center;border:0;border-radius:9px;background:transparent;color:var(--ink)}
.ib svg{width:22px;height:22px}
.ib[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ib:disabled{opacity:.35;cursor:default}
.nbtitle{font-weight:600;max-width:20ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;display:inline-grid;place-items:center;background:transparent}
.sw i{width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 28%,transparent)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.sw.add i{background:conic-gradient(#e33,#fd2,#3c5,#2bd,#46f,#c3e,#e33)}
.wd{width:34px;height:34px;border:0;border-radius:8px;background:transparent;display:inline-grid;place-items:center}
.wd i{display:block;border-radius:50%;background:var(--ink)}
.wd[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.status{font-size:12px;color:var(--muted);padding:0 6px;min-width:76px;text-align:right}
.status.err{color:var(--danger)}
.opts{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:7px 12px;border-top:1px solid var(--line);font-size:14px}
.opts:empty{display:none}
.opts label{font-weight:500}
.opts input[type=text]{width:76px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:var(--raise);font-variant-numeric:tabular-nums;font-size:16px}
.opts .unit{color:var(--muted);margin-right:6px}
.opts .grp{display:inline-flex;align-items:center;gap:2px}
.opts .hint{font-size:13px;color:var(--muted);flex:1 1 240px;min-width:0}
.opts .hint b{color:var(--ink);font-size:16px}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.menu{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding:10px 12px 12px;border-top:1px solid var(--line)}
.menu .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.zoomgrp{display:inline-flex;align-items:center;gap:4px}
.zoomgrp .zv{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
#scroller{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y;position:relative}
#pages{display:grid;justify-content:center;align-content:start;gap:10px;width:max-content;min-width:100%;box-sizing:border-box;padding:20px 16px 90px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sheet{width:var(--pw,880px);display:flex;flex-direction:column;gap:6px}
.page{position:relative;width:100%;background:#fff;box-shadow:0 1px 2px var(--paper-shadow),0 12px 30px -16px var(--paper-shadow);touch-action:pan-x pan-y;cursor:crosshair}
#pages.finger .page{touch-action:none}
.page canvas{position:absolute;display:block;pointer-events:none}
.pfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding:0 2px;margin-bottom:12px}
.pfoot .acts{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.pfoot button{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:4px 7px;border-radius:6px}
.pfoot button.warn{color:var(--danger);font-weight:600}
.pfoot button.star[aria-pressed="true"]{color:#d98a00}
.pfoot select{border:1px solid var(--line);border-radius:6px;background:var(--raise);font-size:12.5px;padding:2px 4px;color:var(--muted)}
.addpage{border:1.5px dashed var(--line);background:transparent;border-radius:10px;padding:14px 22px;color:var(--muted);font-weight:500;width:var(--pw,880px)}
.selmenu{position:absolute;z-index:4;display:flex;flex-wrap:wrap;gap:4px;align-items:center;max-width:360px;background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 10px 28px -10px var(--paper-shadow);cursor:default;-webkit-user-select:none;user-select:none}
.selmenu .sw{width:26px;height:26px}.selmenu .sw i{width:17px;height:17px}
.selmenu .btn{padding:5px 8px;font-size:13px}
.textedit{position:absolute;z-index:3;margin:0;padding:0;border:0;outline:1.5px dashed var(--accent);outline-offset:3px;background:rgba(255,255,255,.55);resize:none;overflow:hidden;line-height:1.3;font-family:var(--f-ui);transform-origin:0 0;min-height:1em;-webkit-user-select:text;user-select:text}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--desk);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
.pop{position:fixed;z-index:20;width:min(340px,calc(100vw - 16px));background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px -10px var(--paper-shadow);padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.poptitle{font-weight:600;font-size:15px}
.poprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.poprow.end{justify-content:space-between}
.poprow label{font-weight:500}
.poprow .unit{color:var(--muted);margin-right:6px}
.poprow .info{color:var(--muted)}
.poprow input{width:70px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);font-size:16px;font-variant-numeric:tabular-nums}
.poprow .btn{padding:7px 11px;font-size:14px}
/* Pages overview */
#pv{position:fixed;inset:0;z-index:15;background:var(--desk);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pvhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.pvhead h2{margin:0;font-size:17px;font-weight:600;flex:1}
#pvGrid{flex:1;overflow:auto;padding:18px 16px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px;align-content:start}
.pvcard{display:flex;flex-direction:column;gap:6px;min-width:0}
.pvcard canvas{width:100%;height:auto;background:#fff;box-shadow:0 1px 2px var(--paper-shadow),0 6px 16px -8px var(--paper-shadow);cursor:pointer;display:block}
.pvcard .pvn{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pvcard .pvb{display:flex;flex-wrap:wrap;gap:2px}
.pvcard .pvb button{border:1px solid var(--line);background:var(--raise);border-radius:6px;font-size:12.5px;padding:3px 7px}
.pvcard .pvb button.warn{color:var(--danger);font-weight:600}
.pvcard .star[aria-pressed="true"]{color:#d98a00}
.langpick{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:0 4px 0 10px}
.langpick select{border:0;background:transparent;padding:8px 4px;font-weight:500;max-width:9.5em}
.langsel{border:1px solid var(--line);border-radius:8px;background:var(--raise);padding:6px 8px}
#scroller{direction:ltr}
[dir="rtl"] #backBtn svg{transform:scaleX(-1)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:520px){.brand{font-size:46px}#grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}#pvGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>


<div id="app">
<section id="lib" aria-label="Notebooks" data-i18n-aria-label="nbs">
  <header class="libhead">
    <div class="brand">Kritzelei<small id="where" data-i18n="openingNbs">Opening notebooks…</small></div>
    <div class="libactions">
      <label class="langpick"><span aria-hidden="true">🌐</span><select id="langSel" aria-label="Language" data-i18n-aria-label="language"></select></label>
      <button class="btn" id="pdfImportBtn" type="button"><span data-i18n="importPdf">Import PDF</span></button>
      <button class="btn" id="backupBtn" type="button"><span data-i18n="saveBackup">Save backup</span></button>
      <button class="btn" id="importBtn" type="button"><span data-i18n="restore">Restore</span></button>
      <button class="btn primary" id="newBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="newNb">New notebook</span></button>
    </div>
  </header>
  <form class="newform" id="newForm" hidden>
    <input type="text" id="newTitle" placeholder="Title, e.g. “Thermodynamics”" data-i18n-placeholder="titlePh" maxlength="80">
    <div class="seg" id="newPaper" role="group" aria-label="Paper" data-i18n-aria-label="paper"></div>
    <button class="btn primary" type="submit"><span data-i18n="create">Create</span></button>
    <button class="btn" type="button" id="newCancel"><span data-i18n="cancel">Cancel</span></button>
  </form>
  <div class="libtools">
    <input type="search" id="search" placeholder="Search titles and text" data-i18n-placeholder="searchPh" aria-label="Search" data-i18n-aria-label="search">
    <div class="chips" id="folders" role="group" aria-label="Folders" data-i18n-aria-label="folders"></div>
  </div>
  <datalist id="folderList"></datalist>
  <div id="grid"></div>
  <p class="note" id="nothing" hidden><span data-i18n="nothing">Nothing found.</span></p>
  <div class="empty" id="empty" hidden>
    <canvas id="emptyArt" width="440" height="180" aria-hidden="true"></canvas>
    <h2><span data-i18n="emptyTitle">Nothing here yet</span></h2>
    <p><span data-i18n="emptyText">Create a notebook or import a PDF and write with Apple Pencil. Scroll with one finger, pinch with two fingers to zoom.</span></p>
    <button class="btn primary" type="button" id="emptyNew"><span data-i18n="firstNb">Create your first notebook</span></button>
  </div>
  <p class="note" id="libnote"></p>
</section>

<section id="nb" hidden aria-label="Notebook" data-i18n-aria-label="nb">
  <div class="bar">
    <div class="barin">
      <button class="ib" id="backBtn" type="button" title="Back to notebooks" data-i18n-title="toNbs" aria-label="Back to notebooks" data-i18n-aria-label="toNbs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="nbtitle" id="nbTitle"></span>
      <span class="sep"></span>
      <button class="ib" data-tool="pen" type="button" title="Pen" data-i18n-title="t_pen" aria-label="Pen" data-i18n-aria-label="t_pen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20l1.2-4.6L16.5 4.1a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M14.5 6l3.5 3.5"/></svg></button>
      <button class="ib" data-tool="hl" type="button" title="Highlighter" data-i18n-title="t_hl" aria-label="Highlighter" data-i18n-aria-label="t_hl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 15l-3 3h5l1-1"/><path d="M9 15l7.5-7.5 3 3L12 18z"/><path d="M14.5 5.5l2-2 4 4-2 2"/><path d="M3 21h18" stroke-linecap="round"/></svg></button>
      <button class="ib" data-tool="ln" type="button" title="Line (ruler)" data-i18n-title="t_ln" aria-label="Line" data-i18n-aria-label="line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 17.5L17.5 3 21 6.5 6.5 21z"/><path d="M7 13.5l1.5 1.5M10 10.5l2 2M13 7.5l1.5 1.5"/></svg></button>
      <button class="ib" data-tool="shape" type="button" title="Shapes and dimensions" data-i18n-title="t_shape" aria-label="Shapes" data-i18n-aria-label="shapes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="5.5"/><rect x="11" y="11" width="9.5" height="9.5" rx="1"/></svg></button>
      <button class="ib" data-tool="lasso" type="button" title="Lasso" data-i18n-title="lasso" aria-label="Lasso" data-i18n-aria-label="lasso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="9.5" rx="8.5" ry="5.5" stroke-dasharray="3 2.4"/><path d="M7.5 14.3c-.9 1.8-.3 4 1.6 4.7l-.8 2.5"/></svg></button>
      <button class="ib" data-tool="text" type="button" title="Text" data-i18n-title="text" aria-label="Text" data-i18n-aria-label="text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6.5V4.5h14v2M12 4.5v15M9 19.5h6"/></svg></button>
      <button class="ib" data-tool="an" type="button" title="Protractor" data-i18n-title="protractor" aria-label="Protractor" data-i18n-aria-label="protractor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 18.5a9.5 9.5 0 0 1 19 0z"/><path d="M12 18.5L17 11"/><path d="M5.5 12.5l1 .8M12 9v1.3M18.5 12.5l-1 .8"/></svg></button>

        savePage:(nbId,pid,arr)=>tx("pages","readwrite",s=>s.put({pid,nb:nbId,s:arr})),
        deletePage:(nbId,pid)=>tx("pages","readwrite",s=>s.delete(pid)),

        async imageURL(ref){ if(!ref.startsWith("b:")) return ref; if(urls.has(ref)) return urls.get(ref); const row=await tx("blobs","readonly",s=>s.get(ref.slice(2))); if(!row) throw new Error("missing"); const u=URL.createObjectURL(row.blob); urls.set(ref,u); return u; },

      if(pages.includes(S.pages[0])||md||!nb.thumb) nb.thumb=await makeThumb(S.pages[0]);

      c.width=1240; c.height=Math.round(1240*hh/W); x.setTransform(1.24,0,0,1.24,0,0); renderPage(x,pg,null);
      if(!doc) doc=new J({unit:"mm",format:[wmm,hmm],orientation:o,compress:true}); else doc.addPage([wmm,hmm],o);
      doc.addImage(c.toDataURL("image/jpeg",.9),"JPEG",0,0,wmm,hmm);
    }
    const name=(S.nb.title.replace(/[\\/:*?"<>|]+/g," ").trim()||"notes")+".pdf";
    if(await offerFile(name,doc.output("blob"))) toast(tt("pdfReady"));
  }catch(err){ toast(tt("pdfFailed")); }
  btn.disabled=false; lab.textContent=tt("downloadPdf");
};

/* ---- empty-state scribble ---- */
(function(){ const c=$("emptyArt"), x=c.getContext("2d"); x.scale(2,2); const s={t:"p",c:getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||ACC,w:2.6,p:[]}; for(let i=0;i<=120;i++){ const t=i/120; s.p.push(10+t*190,48+Math.sin(t*Math.PI*5)*18*(1-t*.4)+Math.cos(t*23)*3,.35+.6*Math.sin(t*Math.PI)); } drawStroke(x,s); })();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ fontEpoch++; for(const pg of S.pages) if(pg.ctx) redraw(pg); });

/* ---- init ---- */
async function init(){
  let db=null, userId=null, assets=null;
  try{
    if(window.claude&&window.claude.use){
      const [d,u,a]=await Promise.all([window.claude.use("db"),window.claude.use("user"),window.claude.use("assets").catch(()=>null)]);
      if(d&&u){ userId=await u.id(); if(userId){ db=d; assets=a; } }
    }
  }catch(e){}
  if(db) store=cloudStore(db,userId,assets);
  else { try{ store=await idbStore(); }catch(e){ store=memStore(); } }
  try{ books=await store.list(); }
  catch(e){ if(store.kind==="cloud"){ try{ store=await idbStore(); }catch(_){ store=memStore(); } try{ books=await store.list(); }catch(_){ books=[]; } } else books=[]; }
  try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
  await loadLangSetting(); renderWhere();
  renderLib();
}
init();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
})();
</script>
